name: Publish to VK

on:
  push:
    paths:
      - "queue/*.json"

permissions:
  contents: write

concurrency:
  group: vk-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VK_API_VERSION: "5.199"
      VK_GROUP_ID: "48198173"
      VK_GROUP_SCREEN_NAME: "liniya__sporta"
      VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
      VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Detect queued jobs
        id: jobs
        shell: bash
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --diff-filter=AM --name-only HEAD^ HEAD -- 'queue/*.json' > /tmp/vk-jobs.txt
          else
            find queue -maxdepth 1 -type f -name '*.json' -print > /tmp/vk-jobs.txt
          fi

          echo "Queued jobs:"
          cat /tmp/vk-jobs.txt || true

          if [ ! -s /tmp/vk-jobs.txt ]; then
            echo "has_jobs=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_jobs=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish queued jobs
        id: publish
        if: steps.jobs.outputs.has_jobs == 'true'
        shell: bash
        run: |
          status=0
          while IFS= read -r job; do
            echo "Publishing $job"
            node scripts/publish-job.js "$job" || status=1
          done < /tmp/vk-jobs.txt

          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Save publication results
        if: always() && steps.jobs.outputs.has_jobs == 'true'
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- results/)" ]; then
            git config user.name "ls-vk-bot"
            git config user.email "ls-vk-bot@users.noreply.github.com"
            git add results/
            git commit -m "Save VK publication result [skip ci]"
            git push
          else
            echo "No result changes to commit"
          fi

      - name: Fail workflow when VK publication failed
        if: always() && steps.publish.outputs.status == '1'
        run: exit 1
