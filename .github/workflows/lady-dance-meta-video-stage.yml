name: Stage approved Lady Dance Meta-compatible public video URL
on:
  push:
    branches: [main]
    paths:
      - 'media-prep/lady-dance-20261020-meta-video-trigger.json'
permissions:
  contents: write
concurrency:
  group: lady-dance-meta-video-stage-20261020
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'lsevmos-gpt/ls-vk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download exact ready MP4 into an allowed public media path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media
          curl -fLSs --retry 3 --connect-timeout 25 --max-time 240 \
            'https://github.com/lsevmos-gpt/ls-vk/releases/download/lady-dance-20261020-final/lady-dance-20261020-final.mp4' \
            -o media/2026-10-20-lady-dance-meta-collab-final.mp4
          test "$(stat -c%s media/2026-10-20-lady-dance-meta-collab-final.mp4)" = 74586098
          printf '%s  %s\n' 'e565d4f973a20242e51b20e5bd35b24506c6dd1e34111b7ec404f8cd7e2a8bf8' 'media/2026-10-20-lady-dance-meta-collab-final.mp4' | sha256sum --check
          python3 - <<'PY'
          with open('media/2026-10-20-lady-dance-meta-collab-final.mp4','rb') as f:
            f.seek(4)
            assert f.read(4)==b'ftyp'
          print('LADY_DANCE_APPROVED_VIDEO_UNCHANGED')
          PY
      - name: Commit final exact MP4 to authorized raw.githubusercontent.com/media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ls-social-media-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/2026-10-20-lady-dance-meta-collab-final.mp4
          if git diff --cached --quiet; then
            echo 'MEDIA_ALREADY_STAGED';exit 0
          fi
          git commit -m 'Stage authorized final Lady Dance video for Meta API Collab [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
