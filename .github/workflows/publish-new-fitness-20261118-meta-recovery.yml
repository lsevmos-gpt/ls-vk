name: Publish missing New Fitness Reel via DIRECT Meta Graph API ONCE
on:
  push:
    branches: [main]
    paths:
      - 'requests/campaigns/new-fitness-20261118-1830-meta-release.json'
permissions:
  contents: write
concurrency:
  group: new-fitness-20261118-direct-meta-release-once
  cancel-in-progress: false
jobs:
  publish_once:
    name: One-shot authorized New Fitness Instagram Reel, original cover, 3 API collaborators
    if: github.repository == 'lsevmos-gpt/ls-vk' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.actor == 'lsevmos-gpt'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      META_IG_ACCESS_TOKEN: ${{ secrets.META_IG_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_GRAPH_VERSION: v26.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight approved media, syntax, unique reservation and official Meta publisher
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/publish_new_fitness_20261118_meta_recovery.py
          python -m py_compile scripts/instagram_collab.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path("requests/campaigns/new-fitness-20261118-1830-meta-release.json").read_text("utf8"))
          assert r["id"]=="new-fitness-20261118-1830"
          assert r["authorizedByUser"] is True and r["publishNow"] is True
          assert r["route"]=="DIRECT_META_GRAPH_API_GITHUB_ACTIONS"
          assert r["collaborators"]==["katia_shap","sir_ena06","_alie_13_"]
          assert not Path("results/campaigns/new-fitness-20261118-1830-meta.json").exists()
          assert not Path("results/scheduled/instagram/new-fitness-20261118-1830.json").exists()
          print("NEW_FITNESS_DIRECT_META_RECOVERY_PREFLIGHT_PASS")
          PY
      - name: Publish now via existing Meta Graph API and verify media ID and permalink, no VK
        shell: bash
        run: python -m scripts.publish_new_fitness_20261118_meta_recovery
