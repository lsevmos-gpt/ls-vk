name: Approved Shpagat Instagram Meta Collab exact 19:00 MSK 2026-10-27
on:
  push:
    branches: [main]
    paths:
      - 'requests/instagram-meta/20261027-shpagat-exact-1900.json'
permissions:
  contents: write
concurrency:
  group: ls-social-single-approved-provider-submission
  cancel-in-progress: false
jobs:
  instagram:
    if: github.repository == 'lsevmos-gpt/ls-vk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 39
    env:
      META_IG_ACCESS_TOKEN: ${{ secrets.META_IG_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_GRAPH_VERSION: v26.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate approved source, authentic JPEG, direct Meta credentials and collaborator
        run: |
          set -euo pipefail
          test -n "$META_IG_ACCESS_TOKEN" && test -n "$META_IG_USER_ID"
          python -m py_compile scripts/shpagat_ig_20261027.py
          python -m scripts.instagram_collab validate requests/instagram-meta/20261027-shpagat-exact-1900.json
          python -m unittest discover -s tests -p test_instagram_collab.py -v
      - name: Reserve Meta calendar receipt, prepare video, publish at 19:00 with @sir_ena06 once
        run: python -m scripts.shpagat_ig_20261027
