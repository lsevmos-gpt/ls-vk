name: Diagnose stored GitHub PAT identity and permission (one-shot)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vk-gh-pat-auth-check-20261027.yml'
permissions:
  contents: read
jobs:
  pat-check:
    if: >-
      github.repository == 'lsevmos-gpt/ls-vk' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'lsevmos-gpt' &&
      contains(github.event.head_commit.message, '[verify-vk-pat-identity]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VK_SECRETS_WRITE_PAT: ${{ secrets.VK_SECRETS_WRITE_PAT }}
    steps:
      - name: Diagnose only Github auth and granted permissions (never contact VK)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          tok=os.environ.get('VK_SECRETS_WRITE_PAT','')
          print('GH_PAT_PRESENT='+('YES' if len(tok)>10 else 'NO'))
          if len(tok)<10: raise SystemExit(1)
          def request(path):
              req=urllib.request.Request('https://api.github.com'+path,headers={
                'Authorization':'Bearer '+tok,
                'Accept':'application/vnd.github+json',
                'X-GitHub-Api-Version':'2022-11-28',
                'User-Agent':'ls-vk-security-diagnostic'})
              try:
                  with urllib.request.urlopen(req,timeout=15) as res:
                      body=json.loads(res.read(32768))
                      return res.status,body,res.headers
              except urllib.error.HTTPError as e:
                  try: body=json.loads(e.read(8192))
                  except: body={}
                  return e.code,body,e.headers
              except Exception:
                  return 0,{},{}
          s,user,h=request('/user')
          print('GH_PAT_USER_HTTP='+str(s))
          if s==200: print('GH_PAT_OWNER_MATCH='+('YES' if user.get('login')=='lsevmos-gpt' else 'NO'))
          s,metadata,h=request('/repos/lsevmos-gpt/ls-vk')
          print('GH_PAT_REPO_HTTP='+str(s))
          if s==200 and isinstance(metadata.get('permissions'),dict):
              print('GH_PAT_REPO_ADMIN='+('YES' if metadata['permissions'].get('admin') else 'NO'))
          s,body,headers=request('/repos/lsevmos-gpt/ls-vk/actions/secrets/public-key')
          print('GH_PAT_SECRETS_KEY_HTTP='+str(s))
          msg=str(body.get('message','')).lower()
          reason='NONE' if s==200 else ('RESOURCE_NOT_ACCESSIBLE_BY_PAT' if 'resource not accessible by personal access token' in msg else 'BAD_CREDENTIALS' if 'bad credentials' in msg else 'ACCESS_DENIED' if 'forbidden' in msg else 'OTHER')
          print('GH_PAT_SECRETS_KEY_REASON='+reason)
          allowed=str(headers.get('x-accepted-github-permissions',''))
          if allowed and len(allowed)<=200 and all(c.isalnum() or c in '=,; -_' for c in allowed):
              print('GH_API_ACCEPTED_PERMISSIONS='+allowed)
          print('GH_VK_REFRESH=NOT_ATTEMPTED')
          if s!=200: raise SystemExit(1)
          PY
