name: Publish approved Alie video and wall on VK only
on:
  push:
    branches: [main]
    paths:
      - requests/campaigns/alie-20261124-vk.json
permissions:
  contents: write
concurrency:
  group: alie-20261124-vk-one-provider
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'lsevmos-gpt/ls-vk' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.actor == 'lsevmos-gpt'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VK_GROUP_ID: '48198173'
      VK_GROUP_SCREEN_NAME: 'liniya__sporta'
      VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}
      VK_REFRESH_TOKEN: ${{ secrets.VK_REFRESH_TOKEN }}
      VK_DEVICE_ID: ${{ secrets.VK_DEVICE_ID }}
      VK_SECRETS_WRITE_PAT: ${{ secrets.VK_SECRETS_WRITE_PAT }}
      VK_API_VERSION: '5.199'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate exact one-time approval and source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VK_GROUP_TOKEN" && test -n "$VK_REFRESH_TOKEN" && test -n "$VK_DEVICE_ID" && test -n "$VK_SECRETS_WRITE_PAT"
          test ! -e results/campaigns/alie-20261124-vk.json
          node --check scripts/publish_alie_20261124_vk.mjs
          node --check scripts/vk-refresh-lib.mjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('requests/campaigns/alie-20261124-vk.json').read_text())
          assert r['id']=='alie-20261124-vk'
          assert r['approved'] is True and r['authorizedByUser'] is True and r['publishNow'] is True
          assert r['groupId']==48198173
          assert r['videoSHA256']=='fd6801bdac28abf8f6223c3b72a64d0db8eb373f1d758563916be1c53e2b6999'
          assert r['coverSHA256']=='c75a3ac911db2ad4c675350bef8bf459ee7e9f9917c91fd4240d44a375e9b7e2'
          PY
      - name: Download and verify original MP4 and PNG through approved media bridge
        shell: bash
        run: |
          set -euo pipefail
          curl -fLSs --retry 3 --connect-timeout 25 --max-time 480 'https://ls-social-media-bridge.ls-evmos.workers.dev/alie-20261124/vk-original.mp4' -o /tmp/alie-20261124-native.mp4
          curl -fLSs --retry 3 --connect-timeout 25 --max-time 120 'https://ls-social-media-bridge.ls-evmos.workers.dev/alie-20261124/vk-original.png' -o /tmp/alie-20261124-cover.png
          echo 'fd6801bdac28abf8f6223c3b72a64d0db8eb373f1d758563916be1c53e2b6999  /tmp/alie-20261124-native.mp4' | sha256sum --check
          echo 'c75a3ac911db2ad4c675350bef8bf459ee7e9f9917c91fd4240d44a375e9b7e2  /tmp/alie-20261124-cover.png' | sha256sum --check
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          ffmpeg -hide_banner -loglevel error -nostdin -y -i /tmp/alie-20261124-cover.png -frames:v 1 -q:v 1 -update 1 /tmp/alie-20261124-cover.jpg
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,avg_frame_rate,nb_frames -of json /tmp/alie-20261124-native.mp4
      - name: Install existing direct VK dependencies
        run: npm install --omit=dev --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Publish exact video and cover once, verify video and wall
        run: node scripts/publish_alie_20261124_vk.mjs
