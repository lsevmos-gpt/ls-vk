name: Publish revised TABATA 18+ 2K Instagram Meta native Collab and VK once
on:
  push:
    branches: [main]
    paths:
      - 'requests/campaigns/tabata-20261108-v2.json'
permissions:
  contents: write
concurrency:
  group: tabata-20261108-revised-new-cover-caption-once
  cancel-in-progress: false
jobs:
  publish_v2:
    name: Stage verified new cover, then submit native Meta Instagram and VK once
    if: github.repository == 'lsevmos-gpt/ls-vk' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.actor == 'lsevmos-gpt'
    runs-on: ubuntu-latest
    timeout-minutes: 105
    env:
      META_IG_ACCESS_TOKEN: ${{ secrets.META_IG_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_GRAPH_VERSION: v26.0
      VK_GROUP_ID: '48198173'
      VK_GROUP_SCREEN_NAME: liniya__sporta
      VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}
      VK_REFRESH_TOKEN: ${{ secrets.VK_REFRESH_TOKEN }}
      VK_DEVICE_ID: ${{ secrets.VK_DEVICE_ID }}
      VK_SECRETS_WRITE_PAT: ${{ secrets.VK_SECRETS_WRITE_PAT }}
      VK_API_VERSION: '5.199'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify approved campaign, exact new caption, original video, and native collaborator
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/publish_tabata_20261108_v2_meta.py
          node --check scripts/publish_tabata_20261108_v2_vk.mjs
          node --check scripts/vk-refresh-lib.mjs
          python -m scripts.instagram_collab validate requests/instagram-meta/tabata-20261108-v2-polonskayaaleksandra.json
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          req=json.loads(Path('requests/campaigns/tabata-20261108-v2.json').read_text(encoding='utf8'))
          ig=json.loads(Path('requests/instagram-meta/tabata-20261108-v2-polonskayaaleksandra.json').read_text(encoding='utf8'))
          old=json.loads(Path('results/verification/tabata-20261108-2k.json').read_text(encoding='utf8'))
          assert req['id']=='tabata-20261108-v2' and req['approved'] is True
          assert req['publicContent'] is True and req['publishNow'] is True
          assert req['sourceSHA256']==old['sourceSha256']
          assert req['coverSHA256']=='947919e203f619e7c0c1de9695d4162ab19c23df8f4ba7d593a6cd100216ff2b'
          assert req['instagram']=={'handle':'liniya__sporta','collaborators':['polonskayaaleksandra'],'nativeInviteRequired':True}
          assert req['vk']=={'groupId':48198173,'publishWall':True,'noCoauthor':True}
          assert ig['text']==req['caption'] and ig['collaborators']==['polonskayaaleksandra']
          assert old['ok'] is True and old['videoResolution']=='1440x2560' and old['videoBytes']==86051299
          for f in ('results/campaigns/tabata-20261108-v2-meta.json','results/campaigns/tabata-20261108-v2-vk.json','results/verification/tabata-20261108-v2.json'):
              assert not Path(f).exists(),'Previously staged or published. Never create duplicates.'
          print('TABATA_V2_EXPLICIT_PUBLISH_AUTHORIZATION_APPROVED_NO_DUPLICATES')
          PY
      - name: Stage new original cover and JPEG 100 quality, verify existing true 2K video SHA
        shell: bash
        run: bash scripts/stage_tabata_20261108_v2_cover.sh
      - name: Send Meta Reels and native coauthor invitation once
        id: meta
        continue-on-error: true
        shell: bash
        run: python -m scripts.publish_tabata_20261108_v2_meta
      - name: Install VK video uploader dependencies
        shell: bash
        run: npm install --omit=dev --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Send VK original 2K video, new approved cover, and wall post once
        id: vk
        continue-on-error: true
        shell: bash
        run: node scripts/publish_tabata_20261108_v2_vk.mjs
      - name: Report any partial completion for manual reconciliation; never retry
        if: always() && (steps.meta.outcome != 'success' || steps.vk.outcome != 'success')
        shell: bash
        run: |
          echo "::error::TABATA V2 partial or unconfirmed publication; inspect provider receipts before any retry"
          echo "Meta outcome: ${{ steps.meta.outcome }}"
          echo "VK outcome: ${{ steps.vk.outcome }}"
          exit 1
