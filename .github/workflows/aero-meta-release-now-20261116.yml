name: Aero Reels 16 Nov 2026 immediate recovery via existing Meta container only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aero-meta-release-now-20261116.yml'
permissions:
  contents: write
concurrency:
  group: aerostretch-20261116-1830-direct-meta-vk-one-shot
  cancel-in-progress: false
jobs:
  publish_existing:
    if: github.repository == 'lsevmos-gpt/ls-vk' && github.actor == 'lsevmos-gpt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      META_IG_ACCESS_TOKEN: ${{ secrets.META_IG_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_GRAPH_VERSION: v26.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate safe publisher
        run: python -m py_compile scripts/publish_aero_20261116_meta_recovery.py
      - name: Release existing FINISHED container via direct Meta and read back published ID
        run: python -m scripts.publish_aero_20261116_meta_recovery
