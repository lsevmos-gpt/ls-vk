name: Prepare Lady Dance highest-compatible-quality Reel with approved cover
on:
  push:
    branches: [main]
    paths:
      - 'media-prep/lady-dance-20261020-render.json'
permissions:
  contents: write
concurrency:
  group: lady-dance-20261020-one-render
  cancel-in-progress: false
jobs:
  render:
    if: github.repository == 'lsevmos-gpt/ls-vk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      GH_TOKEN: ${{ github.token }}
      VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
      VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Verify exact original and user-supplied cover
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lady results/verification
          curl --fail --show-error --location --retry 3 --connect-timeout 25 --max-time 650 'https://drive.usercontent.google.com/download?id=1cxQEiMo5RSK4lgpNEK5ASCrK93-aoNh9&export=download&confirm=t' -o /tmp/lady/original.mp4
          test "$(stat -c%s /tmp/lady/original.mp4)" = 406740484
          printf '%s  %s\n' '05546ae51efa5f89756cea8c2c618146c071be71fe49e8d2df01b9224d36e4a8' '/tmp/lady/original.mp4' '8f78ccc438204534682a8f492e6fe29504a1612250737b566829d5118243a91e' 'media/2026-10-20-lady-dance-cover-original.png' | sha256sum --check --
          ffprobe -v error -show_entries stream=codec_name,width,height,avg_frame_rate -of json /tmp/lady/original.mp4
      - name: Encode 1080x1920 at original 25 fps with 0.40s real cover and 128k AAC
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel warning -stats -y \
            -loop 1 -framerate 25 -t 0.40 -i media/2026-10-20-lady-dance-cover-original.png \
            -i /tmp/lady/original.mp4 \
            -filter_complex "[0:v]scale=1080:1920:force_original_aspect_ratio=decrease:flags=lanczos,pad=1080:1920:(ow-iw)/2:(oh-ih)/2,setsar=1,format=yuv420p,setpts=PTS-STARTPTS[c];[1:v]scale=1080:1920:flags=lanczos:in_range=full:out_range=limited,fps=25,setsar=1,format=yuv420p,setpts=PTS-STARTPTS[v];[c][v]concat=n=2:v=1:a=0[outv];[1:a:0]adelay=400|400,asetpts=PTS-STARTPTS[outa]" \
            -map "[outv]" -map "[outa]" \
            -c:v libx264 -preset slow -crf 14 -maxrate 23000k -bufsize 46000k -pix_fmt yuv420p -r 25 \
            -color_primaries bt709 -color_trc bt709 -colorspace bt709 \
            -c:a aac -b:a 128k -ar 48000 \
            -movflags +faststart /tmp/lady/lady-dance-20261020-1080p-cover.mp4
      - name: Verify final video dimensions, size, full duration, audio, hash and provider readiness
        shell: bash
        run: |
          set -euo pipefail
          ffprobe -v error -show_format -show_streams -of json /tmp/lady/lady-dance-20261020-1080p-cover.mp4 > /tmp/lady/output.json
          python3 - <<'PY'
          import json, pathlib, hashlib, datetime, os
          p=pathlib.Path('/tmp/lady/lady-dance-20261020-1080p-cover.mp4')
          data=json.loads(pathlib.Path('/tmp/lady/output.json').read_text())
          streams=data['streams']
          v=next(s for s in streams if s.get('codec_type')=='video')
          a=next(s for s in streams if s.get('codec_type')=='audio')
          duration=float(data['format']['duration'])
          size=p.stat().st_size
          assert v['codec_name']=='h264' and (v['width'],v['height'])==(1080,1920) and v['avg_frame_rate']=='25/1',v
          assert a['codec_name']=='aac' and int(a.get('bit_rate','0'))<=140000,a
          assert 41.9 < duration < 42.5, duration
          assert 1_000_000<size<299_000_000,(size,duration)
          with p.open('rb') as f: digest=hashlib.file_digest(f,'sha256').hexdigest()
          record={'id':'lady-dance-20261020','ok':True,'outputFile':p.name,'sizeBytes':size,'duration':duration,'width':v['width'],'height':v['height'],'fps':v['avg_frame_rate'],'videoCodec':v['codec_name'],'videoBitrate':v.get('bit_rate'),'audioCodec':a['codec_name'],'audioBitrate':a.get('bit_rate'),'sha256':digest,'coverFrames':10,'coverDurationSeconds':0.4,'sourceSha256':'05546ae51efa5f89756cea8c2c618146c071be71fe49e8d2df01b9224d36e4a8','approvedCoverSha256':'8f78ccc438204534682a8f492e6fe29504a1612250737b566829d5118243a91e','bufferVideoReady':bool(os.environ.get('BUFFER_API_KEY')),'vkUserTokenConfigured':bool(os.environ.get('VK_USER_TOKEN')),'vkGroupTokenConfigured':bool(os.environ.get('VK_GROUP_TOKEN')),'expectedPublishAt':'2026-10-20T11:00:00+03:00','checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'note':'Only original authorized media; quality-optimized for Reels at 1080x1920; publishing remains separate'}
          pathlib.Path('results/verification/lady-dance-20261020-ready.json').write_text(json.dumps(record,ensure_ascii=False,indent=2)+'\n')
          print('VIDEO_OUTPUT_QA_PASS',json.dumps({k:record[k] for k in ('sizeBytes','duration','width','height','fps','audioBitrate','vkUserTokenConfigured','bufferVideoReady')},ensure_ascii=False))
          PY
          ffmpeg -hide_banner -v error -ss 0.20 -i /tmp/lady/lady-dance-20261020-1080p-cover.mp4 -frames:v 1 -f null -
          ffmpeg -hide_banner -v error -ss 1.00 -i /tmp/lady/lady-dance-20261020-1080p-cover.mp4 -frames:v 1 -f null -
          ffmpeg -hide_banner -v error -sseof -1.0 -i /tmp/lady/lady-dance-20261020-1080p-cover.mp4 -frames:v 1 -f null -
      - name: Make single approved public release asset for Buffer and VK
        shell: bash
        run: |
          set -euo pipefail
          tag='lady-dance-20261020-reel'
          if gh release view "$tag" --repo lsevmos-gpt/ls-vk >/dev/null 2>&1; then
            echo '::error::Release already exists; never overwrite without comparing hashes'
            exit 1
          fi
          gh release create "$tag" /tmp/lady/lady-dance-20261020-1080p-cover.mp4 --repo lsevmos-gpt/ls-vk --title "Lady Dance highest-quality Reel 2026-10-20" --notes 'Approved 1080x1920 H.264 25fps high quality CRF14, cover 0.4s, AAC 128k, original kept intact.' --latest=false
          echo 'PROVIDER_VIDEO=https://github.com/lsevmos-gpt/ls-vk/releases/download/lady-dance-20261020-reel/lady-dance-20261020-1080p-cover.mp4'
      - name: Commit immutable render quality report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ls-reels-prep-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/verification/lady-dance-20261020-ready.json
          git commit -m 'Confirm Lady Dance full-quality cover Reel encode, original provenance and channel readiness [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
