name: Black Friday 2026 VK feed photo once — direct VK API
on:
  push:
    branches: [main]
    paths:
      - requests/campaigns/bf-20261125-feed-photo-vk.json

permissions:
  contents: write

concurrency:
  group: bf-20261125-vk-feed-one-time
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'lsevmos-gpt/ls-vk' && github.ref == 'refs/heads/main' && github.actor == 'lsevmos-gpt'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VK_GROUP_ID: '48198173'
      VK_GROUP_SCREEN_NAME: liniya__sporta
      VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}
      VK_REFRESH_TOKEN: ${{ secrets.VK_REFRESH_TOKEN }}
      VK_DEVICE_ID: ${{ secrets.VK_DEVICE_ID }}
      VK_SECRETS_WRITE_PAT: ${{ secrets.VK_SECRETS_WRITE_PAT }}
      VK_API_VERSION: '5.199'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preflight approved VK-only request, script and absence of prior receipt
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          test -n "$VK_GROUP_TOKEN" && test -n "$VK_REFRESH_TOKEN" && test -n "$VK_DEVICE_ID" && test -n "$VK_SECRETS_WRITE_PAT"
          test ! -e results/campaigns/bf-20261125-feed-photo-vk.json
          node --check scripts/publish_bf_feed_20261125_vk.mjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('requests/campaigns/bf-20261125-feed-photo-vk.json').read_text('utf-8'))
          assert r['id']=='bf-20261125-feed-photo-vk'
          assert r['approved'] is True and r['authorizedByUser'] is True and r['publishNow'] is True
          assert r['groupId']==48198173
          assert r['imageSHA256']=='12a510b27a9d8599b37e762b15690a3d5ecb564113f67016039a1c71abc5bd51'
          assert r['imageURL']=='https://ls-social-media-bridge.ls-evmos.workers.dev/bf-20261125/feed-4x5-1080x1350.jpg'
          assert r['caption'].startswith('🖤💚 ЧЁРНАЯ ПЯТНИЦА В «ЛИНИИ СПОРТА»!')
          print('BLACK_FRIDAY_VK_FEED_USER_APPROVED')
          PY
      - name: Download unchanged approved photo from Cloudflare and validate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 120 \
            'https://ls-social-media-bridge.ls-evmos.workers.dev/bf-20261125/feed-4x5-1080x1350.jpg' \
            -o /tmp/bf-20261125-feed-1080x1350.jpg
          printf '%s  %s\n' \
            '12a510b27a9d8599b37e762b15690a3d5ecb564113f67016039a1c71abc5bd51' \
            '/tmp/bf-20261125-feed-1080x1350.jpg' | sha256sum --check -
          test "$(stat -c%s /tmp/bf-20261125-feed-1080x1350.jpg)" = '872247'
      - name: Install existing direct VK client dependencies
        run: npm install --omit=dev --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Publish approved photo once on VK wall, verify by VK API
        run: node scripts/publish_bf_feed_20261125_vk.mjs
