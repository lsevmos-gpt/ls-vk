name: Instagram 2K from Google Drive via Meta (approved videos)
on:
  push:
    branches: [main]
    paths:
      - 'requests/instagram-drive/*.json'
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        description: 'validate only (default) or process approved unsubmitted videos'
        options: [validate, process]
        default: validate
        required: true
permissions:
  contents: write
concurrency:
  group: ls-social-single-approved-provider-submission
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'lsevmos-gpt/ls-vk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate queue and safety rules (no external calls)
        run: |
          python -m unittest discover -s tests -v
          python -m scripts.instagram_drive_meta validate
  publish:
    needs: validate
    if: >-
      github.repository == 'lsevmos-gpt/ls-vk' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'process' && github.actor == 'lsevmos-gpt'))
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
      META_IG_ACCESS_TOKEN: ${{ secrets.META_IG_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_GRAPH_VERSION: v26.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install secure Google auth and HTTP upload dependencies
        run: python -m pip install --disable-pip-version-check requests google-auth
      - name: Check video tools
        run: |
          ffmpeg -hide_banner -version | head -n 1
          ffprobe -hide_banner -version | head -n 1
      - name: Download approved Drive videos and directly submit to Meta
        run: python -m scripts.instagram_drive_meta process
