name: "One final reconciled Katya Instagram Story attempt via Meta (27 Oct 2026)"
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-katya-instagram-after9007-20261027.yml'
permissions:
  contents: write
concurrency:
  group: ls-social-single-approved-provider-submission
  cancel-in-progress: false
jobs:
  publish_final_once:
    name: "Recheck no published Story, reserve before Meta, await container ready, publish exactly once"
    if: github.repository == 'lsevmos-gpt/ls-vk' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
      META_IG_ACCESS_TOKEN: ${{ secrets.META_IG_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: "Check code syntax before any Meta mutation"
        run: python -m py_compile scripts/recover_katya_instagram_after9007_20261027.py
      - name: "Single final provider submission with 45-second processing settle window"
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.recover_katya_instagram_after9007_20261027
