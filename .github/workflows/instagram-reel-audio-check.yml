name: Read-only Instagram Reel audio diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-reel-audio-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio-diagnostic:
    if: github.repository == 'lsevmos-gpt/ls-vk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      META_IG_ACCESS_TOKEN: ${{ secrets.META_IG_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
    steps:
      - name: Install FFmpeg and FFprobe for audio diagnostics
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Compare published Instagram media to exact uploaded source without changing posts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess,urllib.request,urllib.error,re,hashlib,pathlib
          ID='18180291292430391'
          api='https://graph.facebook.com/v26.0/'
          token=os.environ['META_IG_ACCESS_TOKEN']
          def graph(path,fields):
              from urllib.parse import urlencode
              url=api+path+'?'+urlencode({'fields':fields})
              r=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
              with urllib.request.urlopen(r,timeout=40) as f: return json.load(f)
          info={}
          try:
              account=graph(os.environ['META_IG_USER_ID'],'id,username')
              assert account.get('username')=='liniya__sporta','Unexpected Instagram account'
              print('READ_ONLY_ACCOUNT_CHECK=PASS')
          except Exception as exc:
              print('META_READ_ONLY_CHECK_UNAVAILABLE='+type(exc).__name__)
          
          try:
              info=graph(ID,'id,permalink,media_type,timestamp,username,media_url')
          except Exception as e:
              print('MEDIA_URL_LOOKUP_FAILED='+type(e).__name__)
              try: info=graph(ID,'id,permalink,media_type,timestamp,username')
              except Exception as e2: print('MEDIA_METADATA_LOOKUP_FAILED='+type(e2).__name__)
          if info:
              print('MEDIA_ID_MATCH='+str(info.get('id')==ID))
              print('MEDIA_PERMALINK='+str(info.get('permalink','')))
              print('MEDIA_TYPE='+str(info.get('media_type','')))
              print('MEDIA_TIMESTAMP='+str(info.get('timestamp','')))
              print('MEDIA_OWNER='+str(info.get('username','')))
          def download(url,path):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'})
                  with urllib.request.urlopen(req,timeout=150) as stream, open(path,'wb') as o:
                      while True:
                          chunk=stream.read(1024*1024)
                          if not chunk:break
                          o.write(chunk)
                  print(path+'.DOWNLOAD_BYTES='+str(pathlib.Path(path).stat().st_size))
                  return True
              except Exception as exc:
                  print(path+'.DOWNLOAD_FAILED='+type(exc).__name__)
                  return False
          def test_media(path):
              try:
                  x=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration:stream=index,codec_type,codec_name,sample_rate,channels,bit_rate','-of','json',path],capture_output=True,text=True,timeout=50,check=True)
                  dat=json.loads(x.stdout)
                  print(path+'.STREAMS='+json.dumps(dat,ensure_ascii=True))
                  aud=[s for s in dat.get('streams',[]) if s.get('codec_type')=='audio']
                  if not aud: print(path+'.AUDIO_STREAM=ABSENT');return
                  x=subprocess.run(['ffmpeg','-hide_banner','-nostdin','-i',path,'-vn','-af','volumedetect,silencedetect=noise=-45dB:d=3','-f','null','-'],capture_output=True,text=True,timeout=120)
                  for key in ('mean_volume:','max_volume:','silence_start:','silence_end:'):
                      lines=[line.strip() for line in x.stderr.splitlines() if key in line]
                      if key.startswith('silence_'): lines=lines[:10]
                      for line in lines:print(path+'.LEVEL='+line)
                  print(path+'.DECODE_EXIT='+str(x.returncode))
              except Exception as exc: print(path+'.AUDIO_TEST_FAILED='+type(exc).__name__)
          source='/tmp/reel-uploaded.mp4'
          srcurl='https://raw.githubusercontent.com/lsevmos-gpt/ls-vk/main/media/2026-10-20-lady-dance-meta-collab-final.mp4'
          if download(srcurl,source):
              with open(source,'rb') as f: sha=hashlib.file_digest(f,'sha256').hexdigest()
              print('SOURCE_SHA256_MATCH='+str(sha=='e565d4f973a20242e51b20e5bd35b24506c6dd1e34111b7ec404f8cd7e2a8bf8'))
              test_media(source)
          if info.get('media_url') and info.get('id')==ID:
              dest='/tmp/reel-instagram.mp4'
              if download(info['media_url'],dest): test_media(dest)
          else: print('INSTAGRAM_DELIVERED_MEDIA_NOT_ACCESSIBLE_WITH_CURRENT_FIELDS')
          print('READ_ONLY_AUDIO_DIAGNOSTIC_FINISHED_NO_PUBLICATION')
          PY
