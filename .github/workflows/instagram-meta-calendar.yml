name: Instagram Meta calendar LEGACY validation only (Cloudflare publishes)
on:
  push:
    branches: [main]
    paths:
      - 'calendar/instagram/**/*.json'
      - 'scripts/instagram_meta_calendar.py'
      - 'tests/test_instagram_meta_calendar.py'
      - '.github/workflows/instagram-meta-calendar.yml'
  pull_request:
    paths:
      - 'calendar/instagram/**/*.json'
      - 'scripts/instagram_meta_calendar.py'
      - 'tests/test_instagram_meta_calendar.py'
      - '.github/workflows/instagram-meta-calendar.yml'
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        description: 'Read-only preview; Cloudflare now performs publishing'
        required: true
        options:
          - preview
        default: preview
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'lsevmos-gpt/ls-vk'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline unit tests and approved calendar validation
        run: |
          python -m unittest discover -s tests -v
          python -m scripts.instagram_meta_calendar validate
      - name: Show pending calendar items (no publish)
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'preview'
        run: python -m scripts.instagram_meta_calendar preview
