name: Aero VK immediate cover repair and wall release of existing video once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aero-vk-release-now-20261116.yml'
permissions:
  contents: write
concurrency:
  group: aerostretch-20261116-1830-direct-meta-vk-one-shot
  cancel-in-progress: false
jobs:
  publish_existing:
    if: github.repository == 'lsevmos-gpt/ls-vk' && github.actor == 'lsevmos-gpt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      VK_GROUP_ID: '48198173'
      VK_GROUP_SCREEN_NAME: liniya__sporta
      VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}
      VK_REFRESH_TOKEN: ${{ secrets.VK_REFRESH_TOKEN }}
      VK_DEVICE_ID: ${{ secrets.VK_DEVICE_ID }}
      VK_SECRETS_WRITE_PAT: ${{ secrets.VK_SECRETS_WRITE_PAT }}
      VK_API_VERSION: '5.199'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate safe original-video-only recovery and refresh libraries
        run: |
          set -euo pipefail
          node --check scripts/publish_aero_20261116_vk_recovery.mjs
          node --check scripts/vk-refresh-lib.mjs
          npm install --omit=dev --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Repair custom cover on existing Aero video and publish VK wall NOW by direct VK API
        run: node scripts/publish_aero_20261116_vk_recovery.mjs
