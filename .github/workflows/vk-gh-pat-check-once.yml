name: GitHub VK PAT permissions one-shot diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vk-gh-pat-check-once.yml'
permissions:
  contents: read
concurrency:
  group: ls-vk-refresh-token-manual-serial
  cancel-in-progress: false
jobs:
  safe-github-permission-check:
    if: >-
      github.repository == 'lsevmos-gpt/ls-vk' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'lsevmos-gpt' &&
      contains(github.event.head_commit.message, '[run-gh-pat-permission-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      VK_SECRETS_WRITE_PAT: ${{ secrets.VK_SECRETS_WRITE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify GitHub permission only; never call VK
        run: node scripts/vk-gh-pat-check.mjs
