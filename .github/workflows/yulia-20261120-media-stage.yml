name: Stage Approved Yulia 2K Video and Cover for Cloudflare Meta and VK
on:
  push:
    branches: [main]
    paths:
      - 'requests/staging/yulia-20261120-media.json'
permissions:
  contents: write
concurrency:
  group: yulia-20261120-media-stage-once
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'lsevmos-gpt/ls-vk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google authenticated HTTP downloader
        run: python -m pip install --quiet --disable-pip-version-check google-auth requests
      - name: Download exact user-approved MP4 and 2K JPEG, do not publish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,hashlib,requests
          from pathlib import Path
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          manifest=json.loads(Path('requests/staging/yulia-20261120-media.json').read_text())
          assert manifest['approved'] is True and manifest['stagingOnly'] is True and manifest['id']=='yulia-20261120-media'
          assets=manifest['assets']
          assert len(assets)==2
          key=os.environ.get('GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON','')
          if not key: raise RuntimeError('DRIVE_SERVICE_ACCOUNT_MISSING_NO_STAGING')
          creds=service_account.Credentials.from_service_account_info(json.loads(key),scopes=['https://www.googleapis.com/auth/drive.readonly'])
          creds.refresh(Request())
          ses=requests.Session()
          hdr={'Authorization':'Bearer '+creds.token}
          for a in assets:
            dest=Path(a['path'])
            assert str(dest).startswith('media/yulia-20261120-') and dest.suffix.lower() in ('.mp4','.jpg')
            if dest.exists():
              digest=hashlib.sha256(dest.read_bytes()).hexdigest()
              if digest!=a['sha256']: raise RuntimeError('EXISTING_MEDIA_MISMATCH')
              print('ALREADY_EXACT',dest)
              continue
            meta=ses.get('https://www.googleapis.com/drive/v3/files/'+a['driveFileId'],params={'fields':'id,name,mimeType,size','supportsAllDrives':'true'},headers=hdr,timeout=50)
            if not meta.ok: raise RuntimeError('DRIVE_MEDIA_NOT_READABLE_HTTP_'+str(meta.status_code))
            info=meta.json()
            if info['id']!=a['driveFileId'] or int(info['size'])!=a['bytes']: raise RuntimeError('SOURCE_METADATA_CHANGED')
            dest.parent.mkdir(parents=True,exist_ok=True)
            with ses.get('https://www.googleapis.com/drive/v3/files/'+a['driveFileId'],params={'alt':'media','supportsAllDrives':'true'},headers=hdr,stream=True,timeout=(30,150)) as res:
              if not res.ok: raise RuntimeError('DRIVE_MEDIA_DOWNLOAD_HTTP_'+str(res.status_code))
              with dest.open('wb') as f:
                for chunk in res.iter_content(1024*1024):
                  if chunk: f.write(chunk)
            if dest.stat().st_size!=a['bytes']: raise RuntimeError('MEDIA_SIZE_MISMATCH')
            with dest.open('rb') as f: digest=hashlib.file_digest(f,'sha256').hexdigest()
            if digest!=a['sha256']: raise RuntimeError('MEDIA_SHA256_MISMATCH')
            print('STAGED_VERIFIED',dest.name,dest.stat().st_size,digest)
          PY
      - name: Publish exact media bytes to established public GitHub media host (not social publication)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ls-approved-media-stager
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/yulia-20261120-2k-meta-vk.mp4 media/yulia-20261120-2k-meta-cover.jpg
          if git diff --cached --quiet; then echo 'EXACT_MEDIA_ALREADY_HOSTED'; exit 0; fi
          git commit -m 'Stage user-approved Yulia 2K video and cover for Cloudflare Meta + VK [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'MEDIA_PUBLIC_STAGING_COMMITTED_NOT_SOCIAL_POSTED'
