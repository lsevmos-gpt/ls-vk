name: New social requests validation (no publication)
on:
  push:
    branches: [main]
    paths:
      - 'requests/vk/*.json'
      - 'requests/buffer/*.json'
      - 'requests/scheduled/vk/*.json'
      - 'requests/scheduled/buffer/*.json'
      - 'scripts/validate_social.py'
      - 'scripts/manual_social.py'
      - 'scripts/auto_social.py'
      - 'auto_social_tests/**'
      - '.github/workflows/auto-vk-stories.yml'
      - '.github/workflows/auto-instagram-stories.yml'
      - 'tests/**'
      - '.github/workflows/social-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run safety tests offline
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s auto_social_tests -v
      - name: Validate new requests only (no API calls)
        run: |
          python -m scripts.validate_social
          python -m scripts.auto_social vk validate
          python -m scripts.auto_social buffer validate