name: Lady Dance source read-only preflight
on:
  push:
    branches: [main]
    paths:
      - 'media-prep/lady-dance-20261020-source-check.json'
permissions:
  contents: write
jobs:
  inspect:
    if: github.repository == 'lsevmos-gpt/ls-vk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect public media download endpoints without publishing
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p results/verification
          python3 - <<'PY'
          import urllib.request, json
          fid='1cxQEiMo5RSK4lgpNEK5ASCrK93-aoNh9'
          targets={
            'drive-uc-confirm':f'https://drive.google.com/uc?export=download&id={fid}&confirm=t',
            'drive-usercontent-confirm':f'https://drive.usercontent.google.com/download?id={fid}&export=download&confirm=t',
            'drive-usercontent-uc':f'https://drive.usercontent.google.com/uc?export=download&id={fid}&confirm=t'
          }
          found=[]
          for name, url in targets.items():
            x={'name':name,'url':url}
            try:
              req=urllib.request.Request(url,headers={'Range':'bytes=0-1023','User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=35) as r:
                body=r.read(2048)
                x.update(status=r.status,contentType=r.headers.get('content-type'),contentLength=r.headers.get('content-length'),contentRange=r.headers.get('content-range'),disposition=r.headers.get('content-disposition'),signature=body[:32].hex(),mp4=(body[4:8]==b'ftyp'),html=(b'<html' in body[:150].lower() or b'<!doctype' in body[:150].lower()))
            except Exception as e:
              x['error']=str(e)[:180]
            found.append(x)
          open('results/verification/lady-dance-20261020-source-preflight.json','w').write(json.dumps({'sources':found},ensure_ascii=False,indent=2)+'\n')
          for x in found: print('SOURCE', x)
          PY
      - name: Commit preflight report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ls-social-check-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/verification/lady-dance-20261020-source-preflight.json
          git commit -m 'Read-only Lady Dance original URL preflight [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
