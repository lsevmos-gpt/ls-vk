name: VK corrected PAT and same-runner refresh probe (27 Oct once)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vk-refresh-pat02-once-20261027.yml'
permissions:
  contents: read
concurrency:
  group: ls-vk-refresh-token-manual-serial
  cancel-in-progress: false
jobs:
  one-time-check:
    if: >-
      github.repository == 'lsevmos-gpt/ls-vk' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'lsevmos-gpt' &&
      contains(github.event.head_commit.message, '[one-time-vk-pat02-approved]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate refresh module and offline tests, NO VK requests
        run: |
          set -euo pipefail
          node --check scripts/vk-refresh-probe.mjs
          node --test tests/vk-refresh.test.mjs
      - name: Verify PAT access to repository Actions Secrets BEFORE VK refresh
        env:
          VK_SECRETS_WRITE_PAT: ${{ secrets.VK_SECRETS_WRITE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$VK_SECRETS_WRITE_PAT" ]; then echo "VK_PAT=MISSING;VK_REFRESH=NOT_ATTEMPTED"; exit 1; fi
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 \
            --header "Authorization: Bearer $VK_SECRETS_WRITE_PAT" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/lsevmos-gpt/ls-vk/actions/secrets/public-key)
          echo "VK_PAT_SECRETS_PUBLIC_KEY_HTTP=$status"
          if [ "$status" != 200 ]; then echo "VK_PAT_PREFLIGHT=FAILED;VK_REFRESH=NOT_ATTEMPTED"; exit 1; fi
          echo 'VK_PAT_PREFLIGHT=OK'
      - name: Refresh token, immediately store rotated refresh token, verify VK API only
        env:
          VK_REFRESH_CONFIRM: ROTATE_REFRESH_TOKEN
          VK_REFRESH_ONE_SHOT: LS_VK_20261027_PAT02
          VK_REFRESH_TOKEN: ${{ secrets.VK_REFRESH_TOKEN }}
          VK_DEVICE_ID: ${{ secrets.VK_DEVICE_ID }}
          VK_SECRETS_WRITE_PAT: ${{ secrets.VK_SECRETS_WRITE_PAT }}
          VK_REDIRECT_URI: https://vk.liniyasporta.ru/oauth/callback
        run: |
          set -euo pipefail
          node scripts/vk-refresh-probe.mjs live
