name: Publish Second Floor Reel in IG Meta Collab and VK Clip at 18:30 Moscow (one time)
on:
  schedule:
    - cron: '9 15 22 10 *' # 18:09 Moscow Oct 22; each job waits until 18:20 preprocess / 18:30 post.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: second-floor-reel-20261022-once-ig-and-vk
  cancel-in-progress: false
jobs:
  instagram:
    name: Instagram Meta Collab @kurtvafov_nadir (post no earlier than 18:30 MSK)
    if: github.repository == 'lsevmos-gpt/ls-vk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      META_IG_ACCESS_TOKEN: ${{ secrets.META_IG_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_GRAPH_VERSION: v26.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the approved Reel, cover, collaborator and publishing tests (read-only)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$META_IG_ACCESS_TOKEN" && test -n "$META_IG_USER_ID" || { echo "::error::Missing Meta credentials"; exit 1; }
          python -m unittest discover -s tests -p test_instagram_collab.py -v
          python -m scripts.instagram_collab validate requests/instagram-meta/second-floor-20261022-1830-nadir.json
          python - <<'PY'
          import json
          from pathlib import Path
          qa=json.loads(Path('results/verification/second-floor-reel-20261022-prepared.json').read_text())
          assert qa['ok'] is True and qa['originalSizeBytes']==535389636
          assert qa['scheduledTime']=='2026-10-22T18:30:00+03:00'
          print('SECOND_FLOOR_APPROVED_COVER_VIDEO_QA')
          PY
      - name: Prepare Meta container near 18:20, publish Reel near 18:30 MSK once, send collaborator invite
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.second_floor_reel_20261022_ig

  vk:
    name: VK Clip + community wall video (post no earlier than 18:30 MSK)
    if: github.repository == 'lsevmos-gpt/ls-vk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      VK_API_VERSION: '5.199'
      VK_GROUP_ID: '48198173'
      VK_GROUP_SCREEN_NAME: 'liniya__sporta'
      VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}
      VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
      SOCIAL_PLATFORM: vk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify approved VK Clip request; read-only preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VK_GROUP_TOKEN" && test -n "$VK_USER_TOKEN" || { echo "::error::Missing VK user/group token"; exit 1; }
          npm install --omit=dev --ignore-scripts --no-package-lock --no-audit --no-fund
          node --check scripts/second_floor_reel_20261022_vk.mjs
          node scripts/check_social_targets.mjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          qa=json.loads(Path('results/verification/second-floor-reel-20261022-prepared.json').read_text())
          doc=json.loads(Path('requests/vk/second-floor-20261022-1830-vk-clip.json').read_text())
          assert qa['ok'] and doc['type']=='clip' and doc['notBefore']=='2026-10-22T18:30:00+03:00'
          PY
      - name: Wait until exactly 18:30 MSK; upload and publish ONE approved VK Clip, save provider receipt
        shell: bash
        run: |
          set -euo pipefail
          node scripts/second_floor_reel_20261022_vk.mjs
