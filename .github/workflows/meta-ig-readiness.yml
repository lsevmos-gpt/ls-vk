name: Instagram Meta credential check (read only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meta-ig-readiness.yml'
      - 'scripts/meta_ig_token_health.py'
      - 'tests/test_meta_ig_token_health.py'
  schedule:
    - cron: '17 * * * *' # Hourly read-only credential check; GitHub may delay
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'lsevmos-gpt/ls-vk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      META_IG_ACCESS_TOKEN: ${{ secrets.META_IG_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_GRAPH_VERSION: v26.0
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check required secrets exist without displaying them
        shell: bash
        run: |
          test -n "$META_IG_ACCESS_TOKEN" || { echo "::error::META_IG_ACCESS_TOKEN is not configured"; exit 1; }
          test -n "$META_IG_USER_ID" || { echo "::error::META_IG_USER_ID is not configured"; exit 1; }
          test -n "$META_APP_ID" || { echo "::error::META_APP_ID is not configured; expiry monitoring unavailable"; exit 1; }
          test -n "$META_APP_SECRET" || { echo "::error::META_APP_SECRET is not configured; expiry monitoring unavailable"; exit 1; }
      - name: Test safe token diagnostics and verify Meta account (GET only; never publish)
        run: |
          python -m unittest discover -s tests -p test_meta_ig_token_health.py -v
          python -m scripts.meta_ig_token_health
# Rotation verification requested 2026-10-20: read-only Meta GET, no publishing.
# Fresh read-only credential verification requested before scheduled 2026-10-22 18:30 MSK Reel.
