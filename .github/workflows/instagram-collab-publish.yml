name: Instagram Meta Collab (manual, approved)
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Read-only check or publish an approved Reel'
        required: true
        type: choice
        options:
          - check
          - publish
        default: check
      job_id:
        description: 'Request ID in requests/instagram-meta/ (publish only)'
        required: false
        type: string
      confirmation:
        description: 'To publish, type PUBLISH_APPROVED_COLLAB'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: ls-social-single-approved-provider-submission
  cancel-in-progress: false
jobs:
  instagram-collab:
    if: github.repository == 'lsevmos-gpt/ls-vk' && github.actor == 'lsevmos-gpt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COLLAB_JOB_ID: ${{ inputs.job_id }}
      COLLAB_CONFIRMATION: ${{ inputs.confirmation }}
      COLLAB_OPERATION: ${{ inputs.operation }}
      META_IG_ACCESS_TOKEN: ${{ secrets.META_IG_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_GRAPH_VERSION: v26.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test publisher and existing social protections (offline)
        run: |
          python -m unittest discover -s tests -v
          python -m scripts.validate_social
      - name: Read-only Meta account verification
        shell: bash
        run: |
          set -euo pipefail
          test -n "$META_IG_ACCESS_TOKEN" || { echo '::error::META_IG_ACCESS_TOKEN is missing'; exit 1; }
          test -n "$META_IG_USER_ID" || { echo '::error::META_IG_USER_ID is missing'; exit 1; }
          python -m scripts.instagram_collab check -
      - name: Validate exact Reel job before any mutation
        if: env.COLLAB_OPERATION == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.instagram_collab validate "requests/instagram-meta/$COLLAB_JOB_ID.json"
          test "$COLLAB_CONFIRMATION" = "PUBLISH_APPROVED_COLLAB" || {
            echo '::error::Explicit publishing confirmation missing'; exit 1;
          }
      - name: Reserve unique attempt before calling Meta
        id: reserve
        if: env.COLLAB_OPERATION == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python -m scripts.instagram_collab_guard reserve
          git config user.name 'ls-social-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "results/instagram-meta/$COLLAB_JOB_ID.json"
          git commit -m 'Reserve Instagram collaboration attempt [skip ci]'
          git push origin HEAD:main
          echo "reserved=true" >> "$GITHUB_OUTPUT"
      - name: Publish Reel with collaborator invites (no retries)
        id: publish
        if: steps.reserve.outputs.reserved == 'true'
        shell: bash
        run: |
          set +e
          python -m scripts.instagram_collab publish "requests/instagram-meta/$COLLAB_JOB_ID.json"
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          echo 'Meta submission finished; any uncertainty requires manual reconciliation.'
          exit 0
      - name: Persist final receipt without secrets
        if: always() && steps.reserve.outputs.reserved == 'true'
        shell: bash
        env:
          PUBLISH_EXIT_CODE: ${{ steps.publish.outputs.exit_code }}
        run: |
          set -euo pipefail
          python -m scripts.instagram_collab_guard finalize
          git add -- "results/instagram-meta/$COLLAB_JOB_ID.json"
          git commit -m 'Record Instagram Collab submission status [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Flag partial or uncertain result
        if: always() && steps.reserve.outputs.reserved == 'true' && steps.publish.outputs.exit_code != '0'
        run: |
          echo '::error::Check Instagram and receipt before preparing a new publication. Do not retry this ID.'
          exit 1
