name: Publish Yoga 2K Reel 06 Nov 2026 at 18:30 MSK via native Meta Collab sir_ena06 ONCE
on:
  schedule:
    # UTC+3 Moscow. Early slots guard against GitHub scheduler delays.
    # Worker creates a single video container after 18:00 MSK and publishes at 18:30.
    - cron: '15,25,35,45,55 14 6 11 *'
    - cron: '0,10,20,30,40 15 6 11 *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-yoga-reel-20261106-1830-meta.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Read-only readiness check. Publication runs ONLY from date-scoped cron.'
        required: true
        type: choice
        options: [check]
        default: check
permissions:
  contents: write
concurrency:
  group: yoga-20261106-1830-native-meta-sirena06-one-shot
  cancel-in-progress: false
jobs:
  readiness_only:
    name: READ ONLY 2K video, original cover, caption, native coauthor and Meta identity
    if: >-
      github.repository == 'lsevmos-gpt/ls-vk' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      META_IG_ACCESS_TOKEN: ${{ secrets.META_IG_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_GRAPH_VERSION: v26.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact coauthor, description and date without provider mutations
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/publish_yoga_reel_20261106_1830_meta_sirena.py
          python -m scripts.instagram_collab validate requests/instagram-meta/yoga-reel-20261106-1830-sirena06.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('requests/campaigns/yoga-reel-20261106-1830.json').read_text())
          q=json.loads(Path('requests/instagram-meta/yoga-reel-20261106-1830-sirena06.json').read_text())
          assert r['id']=='yoga-reel-20261106-1830' and r['approved'] is True and r['publicContent'] is True
          assert r['scheduledFor']=='2026-11-06T18:30:00+03:00'
          assert r['instagram']['account']=='liniya__sporta' and r['instagram']['collaborators']==['sir_ena06']
          assert q['postType']=='reel' and q['type']=='instagram-reel' and q['collaborators']==['sir_ena06']
          assert q['text']==r['caption'] and q['shouldShareToFeed'] is True
          assert r['vk']['mayPostWithoutNativeCoauthor'] is False
          print('NOV6_1830_META_NATIVE_COLLAB_CAPTION_APPROVED_READONLY')
          import hashlib
          v=json.loads(Path('results/verification/yoga-reel-20261103-2k.json').read_text())
          assert v['ok'] is True and v['stagingOnly'] is True and v['published'] is False
          assert v['videoResolution']=='1440x2560' and abs(v['videoFps']-25)<0.1
          assert 8_000_000<v['videoBitrate']<25_000_000 and 0<v['audioBitrate']<=128_000
          assert v['sourceSHA256']==r['sourceSHA256']
          assert v['coverOriginalSHA256']=='e9dea808b97a2b32605242c2b3bcc290c5d7125dc1667dce9d0d1a73de18824a'
          assert v['collaboratorInstagram']=='sir_ena06' and v['coverJpegQuality']==100
          for path,size,sha in [(v['videoPath'],v['videoBytes'],v['videoSHA256']),
                                (v['coverMetaPath'],None,v['coverMetaSHA256'])]:
            p=Path(path)
            assert p.is_file() and not p.is_symlink()
            if size is not None:assert p.stat().st_size==size
            with p.open('rb') as fileobj:assert hashlib.file_digest(fileobj,'sha256').hexdigest()==sha
          print('YOGA_TRUE_2K_AND_APPROVED_COVER_SHA_VALIDATED_NO_PUBLISH')
          PY
      - name: Read-only exact Meta business account identity verification
        shell: bash
        run: |
          set -euo pipefail
          test -n "$META_IG_ACCESS_TOKEN" && test -n "$META_IG_USER_ID"
          python -m scripts.instagram_collab check -
          curl --fail --silent --show-error --location --head --max-time 55 \
            https://raw.githubusercontent.com/lsevmos-gpt/ls-vk/main/media/yoga-reel-20261103-2k-ig-vk.mp4 >/dev/null
          curl --fail --silent --show-error --location --head --max-time 35 \
            https://raw.githubusercontent.com/lsevmos-gpt/ls-vk/main/media/yoga-reel-20261103-meta-cover.jpg >/dev/null
          echo 'YOGA_2K_AND_COVER_PUBLIC_URLS_READY_FOR_META'
  publish_native_meta_once:
    name: Scheduled 18:30 MSK direct Meta 2K Reel, native @sir_ena06 invitation, verified receipt
    if: >-
      github.repository == 'lsevmos-gpt/ls-vk' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 105
    env:
      META_IG_ACCESS_TOKEN: ${{ secrets.META_IG_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_GRAPH_VERSION: v26.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check approved source and publisher syntax, never post from push event
        shell: bash
        run: |
          set -euo pipefail
          test -n "$META_IG_ACCESS_TOKEN" && test -n "$META_IG_USER_ID"
          python -m py_compile scripts/publish_yoga_reel_20261106_1830_meta_sirena.py
          python -m scripts.instagram_collab validate requests/instagram-meta/yoga-reel-20261106-1830-sirena06.json
      - name: Reserve once, create native collaborative 2K Meta video container, publish 18:30 MSK
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.publish_yoga_reel_20261106_1830_meta_sirena
