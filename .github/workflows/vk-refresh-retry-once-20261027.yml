name: Verify VK GitHub PAT and refresh once (2026-10-27)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vk-refresh-retry-once-20261027.yml'
permissions:
  contents: read
concurrency:
  group: ls-vk-refresh-token-manual-serial
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.repository == 'lsevmos-gpt/ls-vk' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'lsevmos-gpt' &&
      contains(github.event.head_commit.message, '[vk-refresh-retry-one-shot]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check syntax and all offline tests, no VK calls
        run: |
          set -euo pipefail
          node --check scripts/vk-refresh-probe.mjs
          node --test tests/vk-refresh.test.mjs
      - name: Verify PAT can read Actions Secrets public key, no VK calls
        env:
          VK_SECRETS_WRITE_PAT: ${{ secrets.VK_SECRETS_WRITE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VK_SECRETS_WRITE_PAT" || { echo "GH_PAT_SECRET=MISSING"; exit 1; }
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 --request GET \
            --header "Authorization: Bearer $VK_SECRETS_WRITE_PAT" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/lsevmos-gpt/ls-vk/actions/secrets/public-key)
          echo "GH_PAT_SECRETS_PUBLIC_KEY_HTTP=$status"
          test "$status" = 200 || { echo "GH_PAT_PERMISSION_CHECK=FAILED;VK_REFRESH=NOT_CALLED"; exit 1; }
      - name: Rotate refresh secret and verify VK API on the SAME runner, no video or posts
        env:
          VK_REFRESH_CONFIRM: ROTATE_REFRESH_TOKEN
          VK_REFRESH_ONE_SHOT: LS_VK_20261027
          VK_REFRESH_TOKEN: ${{ secrets.VK_REFRESH_TOKEN }}
          VK_DEVICE_ID: ${{ secrets.VK_DEVICE_ID }}
          VK_SECRETS_WRITE_PAT: ${{ secrets.VK_SECRETS_WRITE_PAT }}
          VK_REDIRECT_URI: 'https://vk.liniyasporta.ru/oauth/callback'
        run: node scripts/vk-refresh-probe.mjs live
